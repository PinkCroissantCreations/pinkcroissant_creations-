        // AVAILABILITY BADGES HELPER
        function getAvailabilityBadgeData(product) {
            const status = product.availabilityStatus || 'in_stock';

            if (status === 'out_of_stock' || (product.stock !== undefined && product.stock <= 0)) {
                return {
                    class: 'bg-rose-50 text-rose-700 border-rose-200',
                    dotClass: 'bg-rose-500',
                    icon: 'slash',
                    label: 'Sold Out',
                    isOutOfStock: true
                };
            } else if (status === 'made_to_order') {
                return {
                    class: 'bg-sky-50 text-sky-700 border-sky-200',
                    dotClass: 'bg-sky-500',
                    icon: 'clock',
                    label: 'Made to Order',
                    isOutOfStock: false
                };
            } else {
                const countText = `(${product.stock || 1} pcs)`;
                return {
                    class: 'bg-emerald-50 text-emerald-700 border-emerald-200',
                    dotClass: 'bg-emerald-500',
                    icon: 'check-circle',
                    label: `In Stock ${countText}`,
                    isOutOfStock: false
                };
            }
        }

        function initApp() {
            updateIgHandleDisplays();
            renderCategoryFilters();
            renderProducts();
            renderCart();
            if (window.lucide) {
                lucide.createIcons();
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }

        function updateIgHandleDisplays() {
            const hIg = document.getElementById('headerIgDisplay');
            const fIg = document.getElementById('footerIgDisplay');
            const inputIg = document.getElementById('igHandleInput');
            if (hIg) hIg.innerText = '@' + instagramHandle;
            if (fIg) fIg.innerText = '@' + instagramHandle;
            if (inputIg) inputIg.value = instagramHandle;
        }

        function renderCategoryFilters() {
            const mainBar = document.getElementById('mainCategoriesBar');
            if (!mainBar) return;

            mainBar.innerHTML = mainCategories.map(cat => {
                const isActive = currentMainCategory === cat.id;
                const activeClass = isActive 
                    ? 'gradient-pink text-white shadow-md shadow-pink-200' 
                    : 'bg-white text-slate-700 hover:bg-pink-50 border border-pink-200/80';
                return `
                    <button onclick="setMainCategory('${cat.id}')" 
                            class="px-4 py-2 rounded-full text-xs sm:text-sm font-extrabold transition-all flex items-center gap-1.5 ${activeClass}">
                        <i data-lucide="${cat.icon}" class="w-3.5 h-3.5"></i>
                        <span>${cat.name}</span>
                    </button>
                `;
            }).join('');

            const subBar = document.getElementById('subCategoriesBar');
            if (subBar) {
                if (currentMainCategory === 'knitted') {
                    subBar.classList.remove('hidden');
                    subBar.classList.add('flex');
                    subBar.innerHTML = `
                        <span class="text-xs font-black text-pink-600 mr-1 flex items-center gap-1">
                            <i data-lucide="corner-down-right" class="w-3.5 h-3.5"></i> Subcategory:
                        </span>
                        ${subCategories.map(sub => {
                            const isActive = currentSubCategory === sub.id;
                            const activeClass = isActive
                                ? 'bg-pink-600 text-white shadow-xs'
                                : 'bg-white/90 text-slate-600 hover:bg-pink-100/60 border border-pink-200';
                            return `
                                <button onclick="setSubCategory('${sub.id}')" 
                                        class="px-3 py-1.5 rounded-full text-xs font-bold transition-all ${activeClass}">
                                    ${sub.name}
                                </button>
                            `;
                        }).join('')}
                    `;
                } else {
                    subBar.classList.add('hidden');
                    subBar.classList.remove('flex');
                }
            }

            const sizeBar = document.getElementById('sizeSubCategoriesBar');
            if (sizeBar) {
                if (currentMainCategory === 'knitted' && currentSubCategory === 'bears') {
                    sizeBar.classList.remove('hidden');
                    sizeBar.classList.add('flex');
                    sizeBar.innerHTML = `
                        <span class="text-xs font-black text-pink-500 mr-1 flex items-center gap-1">
                            <i data-lucide="corner-down-right" class="w-3.5 h-3.5"></i> Size:
                        </span>
                        ${bearSizes.map(sz => {
                            const isActive = currentBearSize === sz.id;
                            const activeClass = isActive
                                ? 'bg-rose-500 text-white shadow-xs'
                                : 'bg-white text-slate-600 hover:bg-pink-50 border border-pink-200';
                            return `
                                <button onclick="setBearSize('${sz.id}')" 
                                        class="px-3 py-1 rounded-full text-xs font-bold transition-all ${activeClass}">
                                    ${sz.name}
                                </button>
                            `;
                        }).join('')}
                    `;
                } else {
                    sizeBar.classList.add('hidden');
                    sizeBar.classList.remove('flex');
                }
            }

            if (window.lucide) lucide.createIcons();

        function setMainCategory(catId) {
            currentMainCategory = catId;
            currentSubCategory = 'all';
            currentBearSize = 'all';
            renderCategoryFilters();
            renderProducts();
        }

        function setSubCategory(subId) {
            currentSubCategory = subId;
            currentBearSize = 'all';
            renderCategoryFilters();
            renderProducts();
        }

        function setBearSize(sizeId) {
            currentBearSize = sizeId;
            renderCategoryFilters();
            renderProducts();
        }

        function resetAllFilters() {
            currentMainCategory = 'all';
            currentSubCategory = 'all';
            currentBearSize = 'all';
            searchQuery = '';
            const dInput = document.getElementById('searchInputDesktop');
            const mInput = document.getElementById('searchInputMobile');
            if (dInput) dInput.value = '';
            if (mInput) mInput.value = '';
            renderCategoryFilters();
            renderProducts();
        }

        function handleSearch(val) {
            searchQuery = val.trim().toLowerCase();
            const dInput = document.getElementById('searchInputDesktop');
            const mInput = document.getElementById('searchInputMobile');
            if (dInput && dInput.value !== val) dInput.value = val;
            if (mInput && mInput.value !== val) mInput.value = val;
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const noResults = document.getElementById('noResultsState');
            if (!grid) return;

            const filtered = products.filter(p => {
                if (currentMainCategory !== 'all' && p.mainCategory !== currentMainCategory) return false;
                if (currentMainCategory === 'knitted' && currentSubCategory !== 'all' && p.subCategory !== currentSubCategory) return false;
                if (currentMainCategory === 'knitted' && currentSubCategory === 'bears' && currentBearSize !== 'all' && p.size !== currentBearSize) return false;

                if (searchQuery) {
                    const matchName = p.name.toLowerCase().includes(searchQuery);
                    const matchDesc = p.desc.toLowerCase().includes(searchQuery);
                    if (!matchName && !matchDesc) return false;
                }

                return true;
            });

            const countElem = document.getElementById('productsCount');
            if (countElem) countElem.innerText = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = '';
                if (noResults) noResults.classList.remove('hidden');
                return;
            }

            if (noResults) noResults.classList.add('hidden');
            grid.innerHTML = filtered.map(prod => {
                const avail = getAvailabilityBadgeData(prod);

                return `
                <div class="group bg-white rounded-3xl border border-pink-100 overflow-hidden shadow-xs hover:shadow-xl hover:border-pink-300 transition-all duration-300 flex flex-col justify-between cursor-pointer" onclick="openProductModal(${prod.id})">
                    <div>
                        <div class="relative w-full h-56 bg-pink-50/50 overflow-hidden">
                            <img src="${prod.image}" alt="${prod.name}" 
                                 class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                                 loading="lazy"
                                 onerror="this.src='https://placehold.co/600x400/feeef4/e84880?text=Pink+Croissant'">
                            
                            ${prod.badge ? `
                                <span class="absolute top-3 left-3 bg-white/95 backdrop-blur-md text-pink-600 text-xs font-black px-3 py-1 rounded-full shadow-xs border border-pink-100">
                                    ${prod.badge}
                                </span>
                            ` : ''}

                            ${prod.sizeLabel ? `
                                <div class="absolute bottom-3 right-3 bg-slate-900/80 backdrop-blur-xs text-white text-[11px] font-extrabold px-2.5 py-1 rounded-xl">
                                    ${prod.sizeLabel}
                                </div>
                            ` : ''}

                            <div class="absolute top-3 right-3 bg-white/95 backdrop-blur-md text-[10px] font-black px-2.5 py-1 rounded-full shadow-xs border flex items-center gap-1.5 ${avail.class}">
                                <span class="w-1.5 h-1.5 rounded-full ${avail.dotClass}"></span>
                                <span>${avail.label}</span>
                            </div>

                            <div class="absolute inset-0 bg-black/10 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                <span class="bg-white/90 text-slate-800 text-xs font-extrabold px-3 py-1.5 rounded-full shadow-md flex items-center gap-1.5 backdrop-blur-xs">
                                    <i data-lucide="eye" class="w-3.5 h-3.5 text-pink-500"></i> Details
                                </span>
                            </div>
                        </div>

                        <div class="p-5">
                            <h3 class="font-black text-slate-900 text-base leading-snug group-hover:text-pink-600 transition-colors mb-1.5">
                                ${prod.name}
                            </h3>
                            <p class="text-xs text-slate-500 font-medium leading-relaxed mb-4 line-clamp-2">
                                ${prod.desc}
                            </p>
                        </div>
                    </div>

                    <div class="p-5 pt-0" onclick="event.stopPropagation()">
                        <div class="flex items-center justify-between pt-3 border-t border-pink-100">
                            <div>
                                <span class="text-[10px] text-pink-400 font-bold uppercase block tracking-wider">Price</span>
                                <span class="text-lg font-black text-slate-900">€${prod.price.toFixed(2)}</span>
                            </div>
                            
                            ${avail.isOutOfStock ? `
                                <span class="bg-slate-100 text-slate-400 text-xs font-black px-3.5 py-2 rounded-2xl cursor-not-allowed">
                                    Sold Out
                                </span>
                            ` : `
                                <button onclick="addToCart(${prod.id}, 1)" 
                                        class="gradient-pink hover:brightness-105 text-white text-xs font-black px-4 py-2.5 rounded-2xl flex items-center gap-1.5 shadow-md shadow-pink-200 active:scale-95 transition-all">
                                    <i data-lucide="plus" class="w-4 h-4"></i>
                                    <span>Add</span>
                                </button>
                            `}
                        </div>
                    </div>
                </div>
                `;
            }).join('');

            if (window.lucide) lucide.createIcons();
        }

        function openProductModal(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            activeProduct = product;
            activeProductQty = 1;

            const modal = document.getElementById('productModal');
            const card = document.getElementById('productModalCard');
            const mainImg = document.getElementById('modalMainImage');
            const badge = document.getElementById('modalBadge');
            const title = document.getElementById('modalTitle');
            const price = document.getElementById('modalPrice');
            const desc = document.getElementById('modalDesc');
            const catBadge = document.getElementById('modalCategoryBadge');
            const sizeBadge = document.getElementById('modalSizeBadge');
            const availBadge = document.getElementById('modalAvailabilityBadge');
            const thumbsContainer = document.getElementById('modalThumbnails');
            const addBtn = document.getElementById('modalAddToCartBtn');
            const addBtnText = document.getElementById('modalAddToCartBtnText');
            const qtyRow = document.getElementById('modalQuantityRow');
            const totalRow = document.getElementById('modalTotalRow');

            if (mainImg) mainImg.src = product.image;
            if (title) title.innerText = product.name;
            if (price) price.innerText = `€${product.price.toFixed(2)}`;
            if (desc) desc.innerText = product.desc;

            const catObj = mainCategories.find(c => c.id === product.mainCategory);
            if (catBadge) catBadge.innerText = catObj ? catObj.name : 'Handmade';

            if (sizeBadge) {
                if (product.sizeLabel) {
                    sizeBadge.innerText = product.sizeLabel;
                    sizeBadge.classList.remove('hidden');
                } else {
                    sizeBadge.classList.add('hidden');
                }
            }

            if (badge) {
                if (product.badge) {
                    badge.innerText = product.badge;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            }

            const avail = getAvailabilityBadgeData(product);
            if (availBadge) {
                availBadge.className = `text-[11px] font-extrabold px-2.5 py-0.5 rounded-md border flex items-center gap-1.5 ${avail.class}`;
                availBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full ${avail.dotClass}"></span> <span>${avail.label}</span>`;
            }

            if (avail.isOutOfStock) {
                if (qtyRow) qtyRow.classList.add('hidden');
                if (totalRow) totalRow.classList.add('hidden');
                if (addBtn) {
                    addBtn.disabled = true;
                    addBtn.className = "w-full bg-slate-100 text-slate-400 py-3 px-5 rounded-2xl font-black text-xs sm:text-sm flex items-center justify-center gap-2 cursor-not-allowed";
                }
                if (addBtnText) addBtnText.innerText = "Sold Out";
            } else {
                if (qtyRow) qtyRow.classList.remove('hidden');
                if (totalRow) totalRow.classList.remove('hidden');
                if (addBtn) {
                    addBtn.disabled = false;
                    addBtn.className = "w-full gradient-pink hover:brightness-105 text-white py-3 px-5 rounded-2xl font-black text-xs sm:text-sm flex items-center justify-center gap-2 shadow-lg shadow-pink-200 active:scale-[0.98] transition-all cursor-pointer";
                }
                if (addBtnText) addBtnText.innerText = "Add to Cart";
            }

            const imgList = (product.images && product.images.length > 0) ? product.images : [product.image];
            if (thumbsContainer) {
                thumbsContainer.innerHTML = imgList.map((imgUrl, idx) => `
                    <button onclick="setModalMainImage('${imgUrl}', this)" class="thumbnail-btn w-14 h-14 rounded-xl overflow-hidden border-2 transition-all ${idx === 0 ? 'border-pink-500 scale-95' : 'border-transparent opacity-70 hover:opacity-100'}">
                        <img src="${imgUrl}" class="w-full h-full object-cover">
                    </button>
                `).join('');
            }

            updateModalQtyDisplay();

            if (addBtn) {
                addBtn.onclick = () => {
                    if (!avail.isOutOfStock) {
                        addToCart(product.id, activeProductQty);
                        closeProductModal();
                    }
                };
            }

            if (modal && card) {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                modal.classList.add('opacity-100');
                card.classList.remove('scale-95');
                card.classList.add('scale-100');
            }

            if (window.lucide) lucide.createIcons();
        }

        function setModalMainImage(src, btn) {
            const mainImg = document.getElementById('modalMainImage');
            if (mainImg) mainImg.src = src;
            document.querySelectorAll('.thumbnail-btn').forEach(b => {
                b.classList.remove('border-pink-500', 'scale-95');
                b.classList.add('border-transparent', 'opacity-70');
            });
            if (btn) {
                btn.classList.add('border-pink-500', 'scale-95');
                btn.classList.remove('border-transparent', 'opacity-70');
            }
        }

        function changeModalQuantity(delta) {
            if (!activeProduct) return;
            const maxStock = activeProduct.stock !== undefined ? activeProduct.stock : 99;
            activeProductQty += delta;
            if (activeProductQty < 1) activeProductQty = 1;
            if (activeProduct.availabilityStatus === 'in_stock' && activeProductQty > maxStock) {
                activeProductQty = maxStock;
                showToast(`Max available stock: ${maxStock} items`);
            }
            updateModalQtyDisplay();
        }

        function updateModalQtyDisplay() {
            const disp = document.getElementById('modalQuantityDisplay');
            const totalDisp = document.getElementById('modalTotalPrice');
            if (disp) disp.innerText = activeProductQty;
            if (activeProduct && totalDisp) {
                const total = (activeProduct.price * activeProductQty).toFixed(2);
                totalDisp.innerText = `€${total}`;
            }
        }

        function closeProductModal() {
            const modal = document.getElementById('productModal');
            const card = document.getElementById('productModalCard');
            if (modal && card) {
                modal.classList.add('opacity-0', 'pointer-events-none');
                modal.classList.remove('opacity-100');
                card.classList.add('scale-95');
                card.classList.remove('scale-100');
            }
            activeProduct = null;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeProductModal();
                toggleCartDrawer(false);
                toggleSettingsModal(false);
            }
        });

        // Cart Actions
        function addToCart(productId, quantity = 1) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            const existingIndex = cart.findIndex(item => item.id === productId);
            if (existingIndex > -1) {
                cart[existingIndex].quantity += quantity;
            } else {
                cart.push({
                    id: product.id,
                    price: product.price,
                    image: product.image,
                    quantity: quantity
                });
            }

            renderCart();
            showToast(`Added: ${quantity}x "${product.name}" 🌸`);
        }

        function updateQuantity(productId, delta) {
            const index = cart.findIndex(item => item.id === productId);
            if (index === -1) return;

            cart[index].quantity += delta;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            renderCart();
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cartItemsContainer');
            const badge = document.getElementById('cartCountBadge');
            const summaryHeader = document.getElementById('cartSummaryHeader');
            const subtotalElem = document.getElementById('subtotalPrice');
            const totalElem = document.getElementById('totalPrice');

            const totalItemsCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            if (badge) badge.innerText = totalItemsCount;
            if (summaryHeader) summaryHeader.innerText = `${totalItemsCount} ${totalItemsCount === 1 ? 'item' : 'items'} selected`;

            const totalPrice = cart.reduce((sum, item) => {
                const prod = products.find(p => p.id === item.id);
                return sum + ((prod ? prod.price : item.price) * item.quantity);
            }, 0);

            const formattedTotal = `€${totalPrice.toFixed(2)}`;
            if (subtotalElem) subtotalElem.innerText = formattedTotal;
            if (totalElem) totalElem.innerText = formattedTotal;

            if (!container) return;

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-center p-6 text-slate-400">
                        <div class="w-16 h-16 rounded-full bg-pink-50 flex items-center justify-center mb-3 text-pink-300">
                            <i data-lucide="shopping-bag" class="w-8 h-8"></i>
                        </div>
                        <p class="font-extrabold text-slate-700 text-sm mb-1">Your cart is empty</p>
                        <p class="text-xs text-slate-400 max-w-xs mb-4">Choose some knitted goods, bears or art to get started!</p>
                        <button onclick="toggleCartDrawer(false)" class="text-xs font-black text-pink-600 hover:text-pink-700 underline">
                            Back to products
                        </button>
                    </div>
                `;
                if (window.lucide) lucide.createIcons();
                return;
            }

            container.innerHTML = cart.map(item => {
                const product = products.find(p => p.id === item.id);
                const name = product ? product.name : 'Item';
                const sizeLabel = product && product.sizeLabel ? ` (${product.sizeLabel})` : '';

                return `
                <div class="flex items-center gap-3 bg-pink-50/50 p-3 rounded-2xl border border-pink-100">
                    <img src="${item.image}" alt="${name}" 
                         class="w-14 h-14 object-cover rounded-xl bg-white border border-pink-200"
                         onerror="this.src='https://placehold.co/100x100/feeef4/e84880?text=PC'">
                    
                    <div class="flex-1 min-w-0">
                        <h4 class="text-xs font-black text-slate-900 truncate mb-1" title="${name}">
                            ${name}${sizeLabel}
                        </h4>
                        <div class="text-[11px] text-pink-600 font-bold mb-2">
                            €${item.price.toFixed(2)} / pc
                        </div>
                        
                        <div class="flex items-center gap-2">
                            <div class="flex items-center bg-white border border-pink-200 rounded-lg shadow-xs">
                                <button onclick="updateQuantity(${item.id}, -1)" class="p-1 px-2 text-slate-500 hover:text-pink-600">
                                    <i data-lucide="minus" class="w-3 h-3"></i>
                                </button>
                                <span class="text-xs font-black px-2 text-slate-800">${item.quantity}</span>
                                <button onclick="updateQuantity(${item.id}, 1)" class="p-1 px-2 text-slate-500 hover:text-pink-600">
                                    <i data-lucide="plus" class="w-3 h-3"></i>
                                </button>
                            </div>
                            <span class="text-xs font-black text-slate-900 ml-auto">
                                €${(item.price * item.quantity).toFixed(2)}
                            </span>
                        </div>
                    </div>

                    <button onclick="removeFromCart(${item.id})" class="p-1.5 text-slate-400 hover:text-rose-500 transition-colors" title="Remove">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
                `;
            }).join('');

            if (window.lucide) lucide.createIcons();
        }

        // Toggle Drawers & Modals
        function toggleCartDrawer(open) {
            const drawer = document.getElementById('cartDrawer');
            const backdrop = document.getElementById('cartDrawerBackdrop');
            if (!drawer || !backdrop) return;
            if (open) {
                backdrop.classList.remove('opacity-0', 'pointer-events-none');
                backdrop.classList.add('opacity-100');
                drawer.classList.remove('translate-x-full');
            } else {
                backdrop.classList.add('opacity-0', 'pointer-events-none');
                backdrop.classList.remove('opacity-100');
                drawer.classList.add('translate-x-full');
            }
        }

        function toggleSettingsModal(open) {
            const modal = document.getElementById('settingsModal');
            const card = document.getElementById('settingsModalCard');
            if (!modal || !card) return;
            if (open) {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                modal.classList.add('opacity-100');
                card.classList.remove('scale-95');
                card.classList.add('scale-100');
            } else {
                modal.classList.add('opacity-0', 'pointer-events-none');
                modal.classList.remove('opacity-100');
                card.classList.add('scale-95');
                card.classList.remove('scale-100');
            }
        }

        function saveInstagramHandle() {
            const input = document.getElementById('igHandleInput');
            if (!input) return;
            const val = input.value.trim().replace('@', '');
            if (!val) {
                showToast('Please enter a valid username');
                return;
            }
            instagramHandle = val;
            updateIgHandleDisplays();
            toggleSettingsModal(false);
            showToast(`Instagram @${instagramHandle} ✨`);
        }

        // Generate Order Text (Clean safe strings)
        function generateOrderText() {
            if (cart.length === 0) return null;

            const nameInput = document.getElementById('custName');
            const phoneInput = document.getElementById('custPhone');
            const cityInput = document.getElementById('custCity');
            const notesInput = document.getElementById('custNotes');

            const name = (nameInput && nameInput.value.trim()) ? nameInput.value.trim() : '-';
            const phone = (phoneInput && phoneInput.value.trim()) ? phoneInput.value.trim() : '-';
            const city = (cityInput && cityInput.value.trim()) ? cityInput.value.trim() : '-';
            const notes = (notesInput && notesInput.value.trim()) ? notesInput.value.trim() : '-';
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0).toFixed(2);

            let lines = [
                '🥐 *NEW ORDER REQUEST | PINK CROISSANT*',
                '------------------------------------',
                '📋 *ITEMS:*'
            ];

            cart.forEach((item, index) => {
                const prod = products.find(p => p.id === item.id);
                const prodName = prod ? prod.name : 'Item';
                const itemTotal = (item.price * item.quantity).toFixed(2);
                lines.push(`${index + 1}. ${prodName}\n   └ Qty: ${item.quantity} x €${item.price.toFixed(2)} = €${itemTotal}`);
            });

            lines.push('------------------------------------');
            lines.push(`💰 *TOTAL:* €${totalPrice}\n`);
            lines.push('👤 *CUSTOMER INFO:*');
            lines.push(`• Name: ${name}`);
            lines.push(`• Phone: ${phone}`);
            lines.push(`• City: ${city}`);
            if (notes !== '-') lines.push(`• Notes: ${notes}`);
            lines.push('\nHello! I would love to order the items above. Please let me know regarding availability and payment methods. Thank you so much! 🌸✨');

            return lines.join('\n');
        }

        function copyOrderMessage(quiet = false) {
            const text = generateOrderText();
            if (!text) {
                showToast('Please add products to your cart first!');
                return false;
            }

            const tempInput = document.createElement('textarea');
            tempInput.value = text;
            tempInput.style.position = 'fixed';
            tempInput.style.left = '-9999px';
            document.body.appendChild(tempInput);
            tempInput.select();
            
            let success = false;
            try {
                success = document.execCommand('copy');
            } catch (err) {
                console.error('Clipboard copy failed:', err);
            }
            document.body.removeChild(tempInput);

            if (!quiet) {
                showToast(success ? 'Order copied to clipboard! 📋' : 'Failed to copy.');
            }
            return success;
        }

        function sendOrderViaInstagram() {
            if (cart.length === 0) {
                showToast('Please add products to your cart first!');
                return;
            }

            copyOrderMessage(true);

            const igDirectUrl = `https://ig.me/m/${instagramHandle}`;
            showToast('Copied! Opening Instagram DM... 💌', 2500);

            setTimeout(() => {
                window.open(igDirectUrl, '_blank');
            }, 500);
        }

        // Toast Helper
        let toastTimeout;
        function showToast(message, duration = 3000) {
            const toast = document.getElementById('toast');
            const msgElem = document.getElementById('toastMessage');
            if (!toast || !msgElem) return;
            
            clearTimeout(toastTimeout);
            msgElem.innerText = message;
            
            toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            toast.classList.add('translate-y-0', 'opacity-100');

            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, duration);
        }
    </script>
