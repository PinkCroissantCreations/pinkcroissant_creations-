<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pink Croissant | Shop</title>
  <link rel="icon" type="image/png" href="favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
      tailwind.config = {
          darkMode: 'class',
          theme: {
              extend: {
                  colors: {
                      /* Κύριο Dusty Pink (αντικαθιστά το παλιό πράσινο) */
                      oddGreen: {
                          DEFAULT: '#F4A6B8',
                          hover: '#ec8fa5',
                          light: '#FFF5F6',
                          dark: '#d97a90'
                      },
                      /* Warm Croissant Butter (για λεπτομέρειες & πάνω μπάρα) */
                      oddPink: {
                          DEFAULT: '#FCE18B',
                          hover: '#f7d569',
                          light: '#fffbeb'
                      },
                      /* Σκούρο περίγραμμα και κείμενο */
                      oddBlue: {
                          DEFAULT: '#1e293b'
                      }
                  },
                  fontFamily: {
                      brand: ['Fredoka', 'sans-serif'],
                      sans: ['Plus Jakarta Sans', 'sans-serif'],
                  }
              }
          }
      }
  </script>
  <style>
    :root {
      --oddGreen: #F4A6B8;  /* 1. Dusty Strawberry Pink */
      --oddPink: #FCE18B;   /* 2. Warm Croissant Butter */
      --oddBlue: #1e293b;   /* Σκούρο περίγραμμα / Γράμματα */
      --bgCream: #FFF5F6;   /* 3. Vanilla Milk / Soft Cream Φόντο */
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bgCream);
      color: var(--oddBlue);
    }
    .font-brand {
      font-family: 'Fredoka', cursive;
    }
    .odd-border {
      border: 3px solid #1e293b;
    }
    .odd-shadow {
      box-shadow: 4px 4px 0px #1e293b;
      transition: all 0.2s ease;
    }
    .odd-shadow:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #1e293b;
    }
    .odd-shadow-sm {
      box-shadow: 3px 3px 0px #1e293b;
    }
    .bg-oddGreen { background-color: var(--oddGreen); }
    .bg-oddPink { background-color: var(--oddPink); }
    .bg-oddBlue { background-color: var(--oddBlue); }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- TOP BANNER (Χρώμα Κρουασάν/Βουτύρου #FCE18B) -->
  <div class="bg-oddPink text-slate-900 font-bold text-center py-2 px-4 odd-border border-b text-sm sm:text-base flex items-center justify-center gap-2">
    <span>🥐 Welcome to The Pink Croissant Shop! Enjoy the taste of creativity 🧸</span>
  </div>

  <!-- HEADER (Κύριο Muted Ροζ #F4A6B8) -->
  <header class="sticky top-0 z-3
